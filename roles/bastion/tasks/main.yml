- name: Install required packages
  apt:
    name:
      - fail2ban
      - ufw
    state: present
    update_cache: yes

- name: Enable UFW
  ufw:
    state: enabled
    policy: deny

- name: Allow SSH
  ufw:
    rule: allow
    port: 22
    proto: tcp

- name: Enable fail2ban
  service:
    name: fail2ban
    state: started
    enabled: true