- name: Create prometheus user
  user:
    name: prometheus
    shell: /usr/sbin/nologin
    create_home: no

- name: Create directories
  file:
    path: "{{ item }}"
    state: directory
    owner: prometheus
    group: prometheus
    mode: "0755"
  loop:
    - /etc/prometheus
    - /var/lib/prometheus
    - /opt/prometheus

- name: Download Prometheus
  get_url:
    url: https://github.com/prometheus/prometheus/releases/download/v2.52.0/prometheus-2.52.0.linux-amd64.tar.gz
    dest: /tmp/prometheus.tar.gz

- name: Extract Prometheus
  unarchive:
    src: /tmp/prometheus.tar.gz
    dest: /tmp
    remote_src: yes

- name: Copy binaries
  copy:
    src: "/tmp/prometheus-2.52.0.linux-amd64/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    mode: "0755"
    remote_src: yes
  loop:
    - prometheus
    - promtool

- name: Copy consoles
  copy:
    src: "/tmp/prometheus-2.52.0.linux-amd64/consoles"
    dest: /etc/prometheus/
    remote_src: yes

- name: Copy console_libraries
  copy:
    src: "/tmp/prometheus-2.52.0.linux-amd64/console_libraries"
    dest: /etc/prometheus/
    remote_src: yes

- name: Deploy config
  template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
  notify: restart prometheus

- name: Deploy Prometheus alert rules
  template:
    src: alerts.yml.j2
    dest: /etc/prometheus/alerts.yml
    owner: prometheus
    group: prometheus
    mode: "0644"
  notify: restart prometheus

- name: Create systemd service
  copy:
    dest: /etc/systemd/system/prometheus.service
    content: |
      [Unit]
      Description=Prometheus
      Wants=network-online.target
      After=network-online.target

      [Service]
      User=prometheus
      Group=prometheus
      Type=simple
      ExecStart=/usr/local/bin/prometheus \
        --config.file=/etc/prometheus/prometheus.yml \
        --storage.tsdb.path=/var/lib/prometheus \
        --web.listen-address=:9090

      Restart=always

      [Install]
      WantedBy=multi-user.target
  notify: restart prometheus

- name: Reload systemd
  command: systemctl daemon-reexec

- name: Enable and start Prometheus
  service:
    name: prometheus
    enabled: yes
    state: started