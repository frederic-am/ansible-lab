- name: Create node_exporter user
  user:
    name: node_exporter
    shell: /usr/sbin/nologin
    create_home: no

- name: Create directory
  file:
    path: /opt/node_exporter
    state: directory
    owner: node_exporter
    group: node_exporter
    mode: "0755"

- name: Create textfile collector dir
  file:
    path: /var/lib/node_exporter/textfile_collector
    state: directory
    owner: "{{ node_exporter_textfile_owner | default('node_exporter') }}"
    group: "{{ node_exporter_textfile_group | default('node_exporter') }}"
    mode: "0755"

- name: Download node_exporter
  get_url:
    url: https://github.com/prometheus/node_exporter/releases/download/v1.8.1/node_exporter-1.8.1.linux-amd64.tar.gz
    dest: /tmp/node_exporter.tar.gz

- name: Extract node_exporter
  unarchive:
    src: /tmp/node_exporter.tar.gz
    dest: /tmp
    remote_src: yes

- name: Copy binary
  copy:
    src: /tmp/node_exporter-1.8.1.linux-amd64/node_exporter
    dest: /usr/local/bin/node_exporter
    mode: "0755"
    remote_src: yes

- name: Create systemd service
  copy:
    dest: /etc/systemd/system/node_exporter.service
    content: |
      [Unit]
      Description=Node Exporter
      After=network.target

      [Service]
      User=node_exporter
      Group=node_exporter
      Type=simple
      ExecStart=/usr/local/bin/node_exporter \
      --collector.textfile.directory=/var/lib/node_exporter/textfile_collector

      Restart=always

      [Install]
      WantedBy=multi-user.target
  notify: restart node_exporter

- name: Reload systemd
  command: systemctl daemon-reexec

- name: Enable and start node_exporter
  service:
    name: node_exporter
    enabled: yes
    state: started